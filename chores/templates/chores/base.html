<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Household Chores{% endblock %}</title>
    <style>
        :root { --ink: #172033; --muted: #687086; --line: #e5e8f0; --surface: #fff; --canvas: #f5f7fb; --primary: #4f46e5; --primary-dark: #3730a3; --success: #147a55; --warning: #a45a08; }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: var(--canvas); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.5; }
        .site-header { background: linear-gradient(120deg, #312e81, #4f46e5 58%, #0891b2); color: white; box-shadow: 0 8px 28px rgba(49, 46, 129, .18); }
        .header-inner, main { width: min(1100px, calc(100% - 2rem)); margin: 0 auto; }
        .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 0; }
        .brand { display: flex; align-items: center; gap: .75rem; color: inherit; text-decoration: none; }
        .brand-mark { display: grid; width: 2.5rem; height: 2.5rem; place-items: center; border: 1px solid rgba(255,255,255,.35); border-radius: .8rem; background: rgba(255,255,255,.16); font-size: 1.3rem; }
        .brand strong, .brand small { display: block; } .brand strong { font-size: 1.05rem; } .brand small { opacity: .78; font-size: .8rem; }
        main { padding: 2.5rem 0 3.5rem; }
        h1, h2, p { margin-top: 0; } h2 { font-size: clamp(1.55rem, 3vw, 2rem); letter-spacing: -.035em; margin-bottom: .4rem; }
        .card { overflow: hidden; border: 1px solid var(--line); border-radius: 1rem; background: var(--surface); box-shadow: 0 10px 28px rgba(34, 43, 69, .06); }
        .button, button { display: inline-flex; align-items: center; justify-content: center; min-height: 2.6rem; padding: .6rem 1rem; border: 0; border-radius: .6rem; background: var(--primary); color: white; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; transition: transform .15s, background .15s, box-shadow .15s; }
        .button:hover, button:hover { background: var(--primary-dark); box-shadow: 0 5px 12px rgba(79,70,229,.22); transform: translateY(-1px); }
        .button-secondary { border: 1px solid var(--line); background: white; color: var(--ink); } .button-secondary:hover { background: #f8f9fc; color: var(--ink); box-shadow: none; }
        .button-small { min-height: 2.2rem; padding: .4rem .7rem; font-size: .88rem; }
        form p { margin-bottom: 1.1rem; } label { display: block; margin-bottom: .4rem; font-size: .92rem; font-weight: 700; }
        input, textarea, select { width: 100%; border: 1px solid #cbd2df; border-radius: .55rem; padding: .7rem .75rem; color: var(--ink); background: white; font: inherit; }
        input:focus, textarea:focus, select:focus { outline: 3px solid rgba(79,70,229,.17); border-color: var(--primary); } textarea { min-height: 7rem; resize: vertical; }
        .helptext { color: var(--muted); font-size: .85rem; } .errorlist { margin: .35rem 0 0; padding: 0; color: #b42318; font-size: .88rem; list-style: none; }
        @media (max-width: 640px) { .header-inner { padding: 1rem 0; } main { padding-top: 1.5rem; } }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{% url 'chore_list' %}">
                <span class="brand-mark" aria-hidden="true">✓</span>
                <span><strong>Household Chores</strong><small>Share the load, simply</small></span>
            </a>
            <a class="button button-secondary button-small" href="{% url 'chore_create' %}">+ Add chore</a>
        </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
